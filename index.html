<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- The wordmark is live text in Geist, so the face is wanted on the first paint. -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="description" content="Tasks, lists, and reminders in one place." />
    <meta property="og:title" content="veenna" />
    <meta property="og:description" content="Tasks, lists, and reminders in one place." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <title>Veenna Community</title>
    <script src="/theme-boot.js"></script>
    <script>
      /* Clio's overlay is a transparent, full-display window. It must never paint the boot
         splash (or any backdrop): that was the full-screen flash at launch. */
      if (location.pathname.indexOf('/clio-overlay') === 0) {
        document.documentElement.setAttribute('data-clio-overlay', '')
      }
    </script>
    <style>
      html[data-clio-overlay],
      html[data-clio-overlay] body {
        background: transparent !important;
      }
      html[data-clio-overlay] #boot-splash {
        display: none !important;
      }
    </style>
    <!--
      The boot splash, inline on purpose.

      Nothing here may depend on the bundle: this is what fills the window
      between the first paint and app.mount(), and the stylesheet is imported by
      the very script we are waiting for. Colours mirror --veenna-bg / --veenna-fg
      by hand, keyed off the data-theme that theme-boot.js has already set, so
      the wait matches the app that follows it rather than flashing white.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        /* Above everything from the first frame. The app mounts under the
           splash while worker chats load, and anything of its own with a
           z-index (sidebar, title bar, toasts) would otherwise paint through. */
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #ffffff;
        color: #6b6b6b;
        font:
          500 0.8125rem/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        /*
          The backdrop is solid from the first frame: it is a cover, and a
          cover that fades in lets the app show through the wordmark while
          both are half there. Only the content (grid, wordmark, spinner)
          fades in. The cover leaves in one frame once the app under it has
          settled (sessionSplash.ts): a fade-out would cross-dissolve the
          wordmark into the page, and for that moment the two read as one.

          A boot that beats the eye should show no content at all: a spinner
          that appears and vanishes inside 200ms reads as a flicker, which is
          worse than the wait it was meant to explain.

          The delay is a timer rather than an animation-delay on purpose. The
          window is created with show: false and revealed on ready-to-show, and
          a hidden window's animation timeline does not advance - an animation
          asked to end at opacity 1 would sit at 0 for the whole wait and hand
          back the blank window this exists to replace. A clamped timer fires
          late; a paused timeline never fires at all.
        */
        opacity: 1;
      }
      #boot-splash > #boot-splash-grid,
      #boot-splash > #boot-splash-stack {
        opacity: 0;
        transition: opacity 240ms ease-out;
      }
      #boot-splash.is-visible > #boot-splash-grid,
      #boot-splash.is-visible > #boot-splash-stack {
        opacity: 1;
      }
      [data-theme='dark'] #boot-splash {
        background: #121212;
        color: #9a9a9a;
      }
      #boot-splash-grid {
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 0;
        /* Stronger than dark's 0.18: a dark dot on a light ground reads far
           fainter than a light one on dark, and at 0.18 it all but vanished. */
        background-image: radial-gradient(circle, rgba(26, 26, 26, 0.3) 1px, transparent 1.25px);
        background-size: 20px 20px;
        mask-image: radial-gradient(
          ellipse 78% 62% at 50% 50%,
          transparent 8%,
          rgba(0, 0, 0, 0.45) 42%,
          #000 100%
        );
        -webkit-mask-image: radial-gradient(
          ellipse 78% 62% at 50% 50%,
          transparent 8%,
          rgba(0, 0, 0, 0.45) 42%,
          #000 100%
        );
      }
      [data-theme='dark'] #boot-splash-grid {
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.18) 1px,
          transparent 1.25px
        );
      }
      #boot-splash-stack {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      /*
        One reserved slot for the wordmark. Both theme assets live in this
        cell so a decode, a theme flip, or the bundle's img { display:block }
        preflight cannot grow the flex column and shove the logo down.
      */
      #boot-splash-brand {
        display: grid;
        place-items: center;
        height: 28px;
        overflow: hidden;
        flex-shrink: 0;
      }
      #boot-splash-row {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        height: 1.25rem;
        flex-shrink: 0;
      }
      /* The ellipsis, pulsing rather than sitting there - mirrors the app's own
         .running-status-dots, restated by hand because nothing here may depend
         on the bundle. */
      #boot-splash-dots {
        display: inline-flex;
        align-items: center;
        gap: 0.09em;
        margin-left: 0.06em;
      }
      #boot-splash-dots > span {
        width: 0.22em;
        height: 0.22em;
        min-width: 2px;
        min-height: 2px;
        border-radius: 9999px;
        background-color: currentColor;
        opacity: 0.35;
        animation: boot-splash-dot 1s ease-in-out infinite;
      }
      #boot-splash-dots > span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot-splash-dots > span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-splash-dot {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.88);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      .boot-splash-logo {
        display: block;
        grid-area: 1 / 1;
        height: 28px;
        max-height: 28px;
        width: auto;
        object-fit: contain;
      }
      /* Theme-aware wordmark without JS: overlay, do not remove from flow. */
      #boot-splash-logo-dark {
        visibility: hidden;
      }
      [data-theme='dark'] #boot-splash-logo-light {
        visibility: hidden;
      }
      [data-theme='dark'] #boot-splash-logo-dark {
        visibility: visible;
      }
      /* The Phosphor PhSpinner (regular weight), inlined by hand: nothing here
         may depend on the bundle, so the SVG the app imports as @phosphor-icons/vue
         is restated as raw markup and spun with the same keyframes. */
      /* The workspace boot shows only the pulsing dots; the ring is kept for
         the public share variant, which has no text to pulse. */
      #boot-splash-ring {
        display: none;
        width: 16px;
        height: 16px;
        fill: currentColor;
        animation: boot-splash-spin 700ms linear infinite;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* A public share link is not a workspace opening: no wordmark or grid, just
         the spinner with a line under it, as the share pages draw while they load
         (components/shared/PublicPageLoading.vue). boot-splash.js sets the variant;
         the session splash takes it off again before it reuses this node. */
      #boot-splash-share-label {
        display: none;
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 400;
      }
      #boot-splash[data-variant='share'] #boot-splash-grid,
      #boot-splash[data-variant='share'] #boot-splash-brand,
      #boot-splash[data-variant='share'] #boot-splash-workspace-label {
        display: none;
      }
      #boot-splash[data-variant='share'] #boot-splash-row {
        flex-direction: column;
        gap: 0.75rem;
        height: auto;
      }
      #boot-splash[data-variant='share'] #boot-splash-ring {
        display: block;
        width: 20px;
        height: 20px;
        animation-duration: 1s;
      }
      #boot-splash[data-variant='share'] #boot-splash-share-label {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash > #boot-splash-grid,
        #boot-splash > #boot-splash-stack {
          transition: none;
        }
        #boot-splash-ring {
          animation: none;
          opacity: 0.5;
        }
        #boot-splash-dots > span {
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
  </head>
